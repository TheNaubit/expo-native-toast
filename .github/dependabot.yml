version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: expo
      - dependency-name: expo-module-scripts
      - dependency-name: react
      - dependency-name: react-native
    commit-message:
      prefix: chore
